<head>
    <meta charset="UTF-8">

    <title>RMUTT STUDENT GUIDE</title>
    <style>
        /* CSS การจัดสไตล์เบื้องต้น */
        * { box-sizing: border-box; font-family: 'Sukhumvit Set', 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: #162B75; color: #333; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color:#FFFFFF; margin-bottom: 10px; }
        p { color:#FFFFFF; margin-bottom: 10px; }

        /* ช่องค้นหา */
        .search-container { max-width: 600px; margin: 0 auto 30px auto; }
        .search-input { 
            width: 100%; padding: 15px; font-size: 16px; border: 2px solid #ddd; 
            border-radius: 25px; outline: none; transition: 0.3s;
        }
        .search-input:focus { border-color: #3498db; box-shadow: 0 0 8px rgba(52, 152, 219, 0.3); }

        /* การจัดเลย์เอาต์การ์ดสถานที่ */
        .places-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; max-width: 1200px; margin: 0 auto; 
        }
        .place-card { 
            background: white; border-radius: 12px; overflow: hidden; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; 
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .place-card:hover { transform: translateY(-5px); }
        .place-image { width: 100%; height: 180px; object-fit: cover; }
        .place-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .place-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #2c3e50; }
        .tags { margin: 10px 0; }
        .tag { 
            display: inline-block; background: #e8f4f8; color: #2980b9; 
            padding: 4px 8px; border-radius: 12px; font-size: 12px; margin-right: 5px; margin-bottom: 5px; 
        }
        
        /* ปุ่มต่างๆ */
        .button-group { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        .btn-detail { 
            display: inline-block; width: 100%; text-align: center; padding: 10px; 
            background-color: #27ae60; color: white; border: none; 
            border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s;
            text-decoration: none;
        }
        .btn-detail:hover { background-color: #219150; }

        .btn-map { 
            display: inline-block; width: 100%; text-align: center; padding: 10px; 
            background-color: #4285F4; color: white; text-decoration: none; 
            border-radius: 6px; font-weight: bold; transition: background 0.2s;
        }
        .btn-map:hover { background-color: #3367d6; }
        .no-result { text-align: center; grid-column: 1 / -1; color: #ffffff; font-size: 18px; }

        /* Style สำหรับหน้ารายละเอียดสถานที่ (Detail View) */
        .hidden { display: none !important; }
        
        .detail-container {
            max-width: 900px; margin: 0 auto; background: white; padding: 25px;
            border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-back {
            background: #34495e; color: white; border: none; padding: 10px 20px;
            border-radius: 20px; cursor: pointer; margin-bottom: 20px; font-weight: bold;
            font-size: 15px; transition: background 0.2s;
        }
        .btn-back:hover { background: #2c3e50; }
        
        .detail-main-img {
            width: 100%; height: 350px; object-fit: cover; border-radius: 12px; margin-bottom: 20px;
        }
        .detail-title { font-size: 26px; color: #2c3e50; margin-bottom: 10px; }
        .detail-desc { font-size: 16px; color: #555; line-height: 1.6; margin-bottom: 20px; }
        
        /* แกลเลอรีรูปภาพ */
        .gallery-title { font-size: 20px; color: #2c3e50; margin: 25px 0 15px 0; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .gallery-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px;
        }
        .gallery-img {
            width: 100%; height: 140px; object-fit: cover; border-radius: 8px;
            transition: transform 0.2s; cursor: pointer;
        }
        .gallery-img:hover { transform: scale(1.03); }
    </style>

        // 2. ฟังก์ชันแสดงผลรายการการ์ดสถานที่
        function renderPlaces(items) {
            const grid = document.getElementById('placesGrid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = '<p class="no-result">ไม่พบสถานที่หรือสิ่งอำนวยความสะดวกที่คุณค้นหา</p>';
                return;
            }

            items.forEach(place => {
                const card = document.createElement('div');
                card.className = 'place-card';
                
                const tagsHtml = place.facilities.map(f => `<span class="tag">#${f}</span>`).join('');

                card.innerHTML = `
                    <img src="${place.image}" alt="${place.name}" class="place-image">
                    <div class="place-info">
                        <div>
                            <div class="place-title">${place.name}</div>
                            <p style="font-size:14px; color:#666;">${place.description.substring(0, 70)}...</p>
                            <div class="tags">${tagsHtml}</div>
                        </div>
                        <div class="button-group">
                            <button onclick="showDetailPage(${place.id})" class="btn-detail">🔍 ดูรายละเอียดเพิ่มเติม</button>
                            <a href="${place.googleMapsUrl}" target="_blank" class="btn-map">🗺️ เปิดใน Google Maps</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 3. ฟังก์ชันสลับไปหน้ารายละเอียดสถานที่ (Detail View)
        function showDetailPage(placeId) {
            const place = places.find(p => p.id === placeId);
            if (!place) return;

            const detailContent = document.getElementById('detailContent');
            const tagsHtml = place.facilities.map(f => `<span class="tag">#${f}</span>`).join('');
            
            // สร้างรูปแกลเลอรี
            const galleryImages = place.gallery || [place.image];
            const galleryHtml = galleryImages.map(imgUrl => `
                <img src="${imgUrl}" alt="${place.name}" class="gallery-img" onclick="window.open('${imgUrl}', '_blank')">
            `).join('');

            detailContent.innerHTML = `
                <img src="${place.image}" alt="${place.name}" class="detail-main-img">
                <h2 class="detail-title">${place.name}</h2>
                <div class="tags" style="margin-bottom: 15px;">${tagsHtml}</div>
                <p class="detail-desc">${place.description}</p>
                
                <a href="${place.googleMapsUrl}" target="_blank" class="btn-map" style="max-width: 250px; margin-bottom: 25px;">🗺️ นำทางด้วย Google Maps</a>

                <h3 class="gallery-title">📷 รูปภาพตัวอย่างสถานที่ (${galleryImages.length} รูป)</h3>
                <div class="gallery-grid">
                    ${galleryHtml}
                </div>
            `;

            // ซ่อนหน้าหลัก เปิดหน้ารายละเอียด
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            window.scrollTo(0, 0); // เลื่อนขึ้นไปบนสุด
        }

        // 4. ฟังก์ชันกลับไปหน้าหลัก (Home View)
        function showHomeView() {
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('homeView').classList.remove('hidden');
        }

        // 5. ระบบค้นหา (Search System)
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase().trim();
            
            const filteredPlaces = places.filter(place => {
                const matchName = place.name.toLowerCase().includes(keyword);
                const matchDesc = place.description.toLowerCase().includes(keyword);
                const matchFacility = place.facilities.some(f => f.toLowerCase().includes(keyword));
                
                return matchName || matchDesc || matchFacility;
            });

            renderPlaces(filteredPlaces);
        });

        // แสดงผลรายการครั้งแรก
        renderPlaces(places);
    </script>
</body>
</html>
